<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1648d8" />
  <link rel="icon" href="../assets/jm.png">
  <title>🎂 SG - Mi amor 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="decoration dots dots-top" aria-hidden="true"></div>
    <div class="spark spark-one" aria-hidden="true">✦</div>
    <div class="spark spark-two" aria-hidden="true">✦</div>
    <div class="confetti confetti-one" aria-hidden="true">〰</div>
    <div class="confetti confetti-two" aria-hidden="true">〰</div>

    <section class="countdown-card" aria-labelledby="page-title">
      <div class="cake-wrap" aria-hidden="true">
        <div class="cake">
          <div class="candle"><span class="flame"></span></div>
          <div class="cake-top"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="cake-side">
            <div class="icing"></div>
            <div class="cake-stripe"></div>
            <div class="sprinkles">•　·　•　·　•　·　•</div>
          </div>
          <div class="cake-base"></div>
        </div>
      </div>



      
      <h2 id="page-title">Falta poco para tu Cumpleaños <br>
        <br class="mobile-break"> Mi amor</h2>
      <div class="title-divider"><span></span><b>★</b><span></span></div>

      <div class="countdown" aria-label="Tiempo restante">
        <div class="time-box"><strong id="days">—</strong><span>Días</span></div>
        <div class="time-box"><strong id="hours">—</strong><span>Horas</span></div>
        <div class="time-box"><strong id="minutes">—</strong><span>Minutos</span></div>
        <div class="time-box"><strong id="seconds">—</strong><span>Segundos</span></div>
      </div>

      <div class="message" id="message">
        <span class="party" aria-hidden="true">🎉</span>
        <p>¡Tu día especial se acerca! <span class="heart">♥</span></p>
      </div>
    </section>

    <div class="calendar" aria-hidden="true">
      <div class="calendar-rings"><i></i><i></i></div>
      <div class="calendar-head"></div>
      <div class="calendar-grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span class="calendar-star">★</span>
    </div>
    <div class="gift" aria-hidden="true"><div class="gift-bow">⌁</div><div class="gift-lid"></div><div class="gift-box"><span></span></div></div>
    <div class="decoration dots dots-bottom" aria-hidden="true"></div>
  </main>
</body>
</html>
